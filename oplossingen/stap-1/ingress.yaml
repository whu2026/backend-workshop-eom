apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-demo-ingress-voorbeeld
  namespace: backend-workshop
  labels:
    workshop-owner: voorbeeld
spec:
  ingressClassName: voorbeeld-class

  rules:
    - host: nginx-web-voorbeeld.workshop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-demo-service-voorbeeld
                port:
                  number: 80
